<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Retro-Sketch HTML
    -----------------
    - Defines the toolbar and canvas container.
    - Toolbar has controls with fixed IDs that the JS hooks into.
    - Canvas container is initially empty; cells are generated by sketch.js.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Retro-Sketch</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- App wrapper: flex layout of toolbar + canvas -->
  <div class="app-container">

    <!--
      Toolbar
      -------
      Contains:
      - Pen & background colour pickers
      - Tool buttons (grab, erase, rainbow, shade, lighten)
      - Grid size slider
      - Utility buttons (toggle grid, clear, undo, save, export)
    -->
    <aside class="toolbar">
      <h1>Retro-Sketch</h1>
      <p>Create your own pixel art</p>

      <label>Pen Colour
        <input type="color" id="penColour" value="#000000">
      </label>
      <label>Background
        <input type="color" id="bgColour" value="#ffffff">
      </label>

      <button id="grabColour">Colour Grabber</button>
      <button id="eraserBtn">Eraser</button>
      <button id="rainbowMode">Toggle Rainbow</button>
      <button id="shadeMode">Toggle Shade</button>
      <button id="lightenMode">Toggle Lighten</button>

      <div class="grid-control">
        <span class="grid-label-text">Grid Size (1–60)</span>
        <input type="range" id="gridSize" min="1" max="60" value="24">
        <span id="gridLabel">24×24</span>
      </div>

      <button id="toggleGrid">Toggle Grid Lines</button>
      <button id="clearBtn">Clear</button>
      <button id="undoBtn">Undo</button>
      <button id="saveBtn">Save to Browser</button>
      <button id="exportBtn">Export PNG</button>
    </aside>

    <!--
      Canvas Container
      ----------------
      A CSS grid into which `js/sketch.js` injects N×N .pixel divs.
    -->
    <main id="canvasContainer"></main>
  </div>

  <!-- App logic -->
  <script src="js/sketch.js"></script>
</body>
</html>
